[General]
__userfile__=true

[desktopswitch]
alignment=Left

[fancymenu]
ownIcon=true

[mount]
alignment=Right
ejectAction=ejectOpticalDrives
newDeviceAction=showInfo

[panel1]
plugins=fancymenu, taskbar, desktopswitch, statusnotifier, tray, mount, volume, worldclock, showdesktop

[taskbar]
alignment=Left

[tray]
alignment=Right

[volume]
alignment=Right
device=0
type=volume

[worldclock]
alignment=Right
autoRotate=true
customFormat="'<b>'HH:mm:ss'</b><br/><font size=\"-2\">'ddd, d MMM yyyy'<br/>'TT'</font>'"
dateFormatType=short
dateLongNames=false
datePadDay=false
datePosition=before
dateShowDoW=false
dateShowYear=false
defaultTimeZone=
formatType=short-timeonly
showDate=true
showTimezone=false
showTooltip=false
showWeekNumber=true
timeAMPM=false
timePadHour=false
timeShowSeconds=false
timeZoneWheel=true
timeZones\size=0
timezoneFormatType=iana
timezonePosition=below
useAdvancedManualFormat=false
