# ~/.config/picom.conf
# Sensible defaults for LXQt on X11.
# Docs: https://github.com/yshui/picom/wiki

#################################
#       Backend
#################################

backend = "glx";
vsync = true;

#################################
#       Shadows
#################################

shadow = false;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       Fading
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

#################################
#       Transparency / Opacity
#################################

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [ ];

opacity-rule = [
  "90:class_g = 'lxqt-panel'",
  "85:class_g = 'Rofi'"
];

#################################
#       Blur (disable if GPU is weak)
#################################

#blur: {
#  method = "dual_kawase";
#  strength = 5;
#}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#       General
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; opacity = 0.95; };
  dropdown_menu = { shadow = false; opacity = 0.95; };
};
